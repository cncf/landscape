<!--
  cloudpunks Logo, quadratische gestapelte Variante (1:1).
  Single Source of Truth. cloudpunks-logo-1x1.png wird hieraus gerendert.

  Vektor-Rekonstruktion der bis August 2026 einzigen Fassung, die nur als
  Raster-Export existierte (cloudpunks-logo-1x1-clean.png, seither entfernt).

  Zusammengesetzt aus den Pfaden von cloudpunks-logo-blue.svg (Bildmarke +
  Wortmarke), auf die aus dem PNG ausgemessene Geometrie transformiert:
    Canvas       1394 x 1394, Navy vollflaechig
    Bildmarke    x 238-1154, y  146- 981   (uniform skaliert, Faktor 2.52791)
    Wortmarke    x 191-1192, y 1036-1204   (uniform skaliert, Faktor 1.57023)
    Gelbe Linie  x 456-941,  y 1241-1260   (36 px unter der Wortmarke)

  Farben nach Brand-Soll, nicht nach PNG: das PNG lag bei Navy auf #081D3A
  statt #001E3C und bei Gelb auf #F9D856 statt #FFD62F. Diese Fassung
  korrigiert das.

  Keine <text>-Elemente, keine Font-Abhaengigkeit, kein eingebettetes Raster.
  Details: assets/logo/README.md
-->
